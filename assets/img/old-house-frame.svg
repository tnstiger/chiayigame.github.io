<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" role="img" aria-labelledby="title desc">
  <title id="title">老屋模型固定木構架</title>
  <desc id="desc">依展場老屋模型整理的固定木構架示意，包含地板、立柱、橫樑與山牆屋架，不包含可拼裝的屋頂與四周牆面。</desc>
  <defs>
    <linearGradient id="baseWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3C08C"/>
      <stop offset="1" stop-color="#B97A3F"/>
    </linearGradient>
    <linearGradient id="beamWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9C6532"/>
      <stop offset="1" stop-color="#75451F"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#2B190D" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- 地板基座 -->
    <path d="M92 390 382 425 528 341 238 309Z" fill="url(#baseWood)" stroke="#75451F" stroke-width="6" stroke-linejoin="round"/>
    <path d="M92 390 382 425 382 450 92 414Z" fill="#A86F39" stroke="#75451F" stroke-width="5" stroke-linejoin="round"/>
    <path d="M382 425 528 341 528 365 382 450Z" fill="#8B5529" stroke="#75451F" stroke-width="5" stroke-linejoin="round"/>

    <!-- 地板板條 -->
    <g fill="none" stroke="#8E5A2D" stroke-width="2.5" opacity="0.58">
      <path d="M122 394 267 310"/><path d="M156 398 301 315"/><path d="M190 402 335 319"/>
      <path d="M224 406 369 323"/><path d="M258 410 403 327"/><path d="M292 414 437 331"/>
      <path d="M326 418 471 335"/><path d="M360 422 505 339"/>
    </g>

    <!-- 木構架主線 -->
    <g fill="none" stroke="url(#beamWood)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <!-- 外圈四角立柱 -->
      <path d="M108 388V188M382 424V224M512 343V143M238 309V109"/>
      <!-- 內圈正面立柱 -->
      <path d="M156 396V236M210 403V206M264 410V176M318 417V206"/>
      <!-- 側向立柱 -->
      <path d="M134 373V201M174 350V177M472 366V166M432 389V190"/>
      <!-- 牆頂橫樑 -->
      <path d="M108 188 382 224 512 143 238 109Z"/>
      <!-- 中段橫樑 -->
      <path d="M108 282 382 318 512 237 238 203Z"/>
      <!-- 下段橫樑 -->
      <path d="M108 352 382 388 512 307 238 273Z"/>
      <!-- 正面框架 -->
      <path d="M156 236 318 257M156 318 318 339"/>
      <!-- 側面框架 -->
      <path d="M134 201 238 143M134 292 238 234M382 224 472 166M382 318 472 260"/>
      <!-- 山牆主架 -->
      <path d="M108 188 245 42 382 224M238 109 375 0 512 143"/>
      <path d="M245 42 375 0M245 42 245 188M375 0 375 224"/>
    </g>

    <!-- 屋架補強 -->
    <g fill="none" stroke="#A46B36" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M150 143 245 73 340 168M286 72 375 27 464 116"/>
      <path d="M188 103 245 61 302 124M324 48 375 22 426 82"/>
      <path d="M150 143 340 168M286 72 464 116"/>
      <path d="M197 189 245 148 293 202M330 135 375 96 420 172"/>
    </g>

    <!-- 榫接與支撐細節 -->
    <g fill="none" stroke="#C58A4C" stroke-width="4" stroke-linecap="round" opacity="0.9">
      <path d="M108 236 382 272M108 329 382 365"/>
      <path d="M382 272 512 190M382 365 512 284"/>
      <path d="M238 156 108 235M238 249 108 328"/>
      <path d="M175 197 205 167M285 210 316 180M421 199 450 177M458 263 489 243"/>
    </g>

    <!-- 柱腳 -->
    <g fill="#70401D">
      <circle cx="108" cy="388" r="7"/><circle cx="382" cy="424" r="7"/>
      <circle cx="512" cy="343" r="7"/><circle cx="238" cy="309" r="7"/>
    </g>
  </g>
</svg>
